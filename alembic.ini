[alembic]
; Path to migration scripts
script_location = alembic

; The `sqlalchemy.url` is set at runtime by `alembic/env.py` from project
; configuration. It is intentionally left unset here.
; sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s

; File template and slug settings
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

; Notes:
; - `sqlalchemy.url` is not explicitly set here; `alembic/env.py` will
;   populate it from project settings at runtime.
; - If `DATABASE_URL` is not provided, the project configuration will be
;   used as a fallback.
; - Timezone: project timestamps assume UTC. Use UTC for server_default
;   values in migrations when applicable.
