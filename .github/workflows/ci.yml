name: CI - tests & linters

# CI ワークフロー（概要）
# 実行トリガ: pull_request と main ブランチへの push
# ジョブ:
#  - lint:  コード整形と静的解析（black/isort/flake8）
#  - test:  テスト実行（pytest）および Postgres を使った統合テストの想定
#  - type-check: mypy による型チェック

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  # Lint ジョブ: フォーマッタと静的解析を実行します（black/isort/flake8）。
  # 早期にコードスタイル違反や簡易的な問題を検出して PR を改善します。
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction --no-ansi --with dev

      - name: Run linters
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8
          poetry run mypy app
          poetry run pylint --rcfile=.pylintrc app

  # Test ジョブ: pytest を走らせ、coverage と JUnit レポートを生成します。
  # SQLite データベースを利用するテストを想定しています。
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    # 環境変数をジョブで設定（SQLite 接続情報）
    env:
      # SQLite 用の環境変数
      SQLITE_DB_FILE: ./test_db.sqlite
      DATABASE_URL: sqlite:///./test_db.sqlite
      SQLITE_JOURNAL_MODE: WAL
      SQLITE_SYNCHRONOUS: FULL
      SQLITE_TIMEOUT: 30
      SQLITE_FOREIGN_KEYS: true
      # アプリケーション設定
      APP_NAME: stock-investment-analyzer
      APP_VERSION: 0.0.0-ci
      ENV: test
      EDINET_SUBSCRIPTION_KEY: ${{ secrets.CI_EDINET_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction --no-ansi --with dev

      - name: Setup SQLite database
        run: |
          # SQLite セットアップスクリプトを実行
          bash scripts/databaseSetup/setup_sqlite.sh "$SQLITE_DB_FILE"

      - name: Run Alembic migrations
        run: |
          # Alembic は alembic.ini 内で env.py によって環境変数から DB 接続情報を取得します
          poetry run alembic upgrade head

      - name: Run tests
        run: |
          mkdir -p reports
          poetry run pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml:coverage.xml --junitxml=reports/junit-${{ matrix.python-version }}.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            coverage.xml
            reports/junit-${{ matrix.python-version }}.xml

  # Type-check ジョブ: mypy による型検査を実行します。
  # 型安全性を高めるためのオプションジョブです。
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-mypy-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction --no-ansi --with dev

      - name: Run mypy
        run: |
          poetry run mypy app
