[tool.poetry]
name = "stock-investment-analyzer"
version = "0.1.0"
description = ""
authors = ["DMARU-T"]
readme = "README.md"
packages = [{ include = "app" }]
keywords = ["stocks", "investment", "analyzer"]

[tool.poetry.dependencies]
# Python 3.14 をサポート対象に含めます（3.10 以上、3.15 未満）。
# チームの合意があれば範囲は調整してください。
python = ">=3.10,<3.15"
fastapi = "^0.121.3"
uvicorn = "^0.38.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
black = "^24.9"
isort = "^5.13"
pre-commit = "^3.4"
mypy = "^1.9"
flake8 = "^7.3.0"
pylint = "^4.0"
astroid = "^4.0.1"
pytest-cov = "^4.0"
coverage = "^7.0"
psycopg = { version = "^3.2", extras = ["binary"] }

[tool.poetry.scripts]
# 例: `poetry run sia` で main を起動したい場合
# sia = "app.main:main"  # app.main の main() を指定。実際のエントリに合わせて修正してください。

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = false
